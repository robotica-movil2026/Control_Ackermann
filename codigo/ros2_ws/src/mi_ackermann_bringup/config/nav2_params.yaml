%YAML 1.1
---
# nav2_params.yaml
# Adaptado para el robot bicycle-like (EV3 + Ackermann-en-un-eje).
#
# Cosas clave que se ajustaron respecto al ejemplo generico de Nav2:
#   - footprint real del chasis (base_length=0.35, base_width=0.2 -> ver
#     mi_ackermann_description/urdf/common_propperties.xacro)
#   - use_rotate_to_heading: false en el controller (NO puede girar en el sitio)
#   - min_turning_radius calculado con wheelbase=0.15 y limite de direccion
#     +-0.4 rad del joint 'virtual_front_wheel_joint' -> ~0.77 m
#   - enable_stamped_cmd_vel: true, porque bicycle_steering_controller espera
#     TwistStamped en /bicycle_steering_controller/reference (en Jazzy el
#     default de Nav2 es Twist SIN stamped, hay que activarlo a mano)
#
# IMPORTANTE: primero corrige wheelbase/traction_wheel_radius en
# carlikebot_controllers.yaml (ver chat) antes de tunear esto, si no, todo lo
# que calcules aqui va a estar basado en una odometria con la escala mal.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    default_nav_to_pose_bt_xml: ""   # deja vacio para usar el default del paquete
    default_nav_through_poses_bt_xml: ""

controller_server:
  ros__parameters:
    controller_frequency: 10.0     # igual al update_rate del controller_manager
    enable_stamped_cmd_vel: true   # clave para que cmd_vel salga como TwistStamped
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.4  # 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.3

      # --- lo importante para un robot que no puede girar en el sitio ---
      use_rotate_to_heading: false
      allow_reversing: true        # ponlo en true solo si tu bicycle_steering_controller soporta velocidad negativa de traccion de forma confiable

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9   # un poco mayor al min_turning_radius del planner
      regulated_linear_scaling_min_speed: 0.1

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      minimum_turning_radius: 0.35       # calculado: wheelbase / tan(0.4 rad)
      motion_model_for_search: "REEDS_SHEPP"   # cambia a "REEDS_SHEPP" si activas allow_reversing arriba
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_max_length: 3.0

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]   # OJO: "spin" no tiene sentido en un robot que no gira en el sitio, no lo agregues
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]   # velocidad de traccion negativa muy limitada; ajusta si allow_reversing=true
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]
    odom_topic: "bicycle_steering_controller/odometry"
    odom_duration: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # footprint real del chasis, centrado en base_link (base_length=0.35, base_width=0.2)
      footprint: "[[0.175, 0.1], [0.175, -0.1], [-0.175, -0.1], [-0.175, 0.1]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 0.6
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4   # >= al regulated_linear_scaling_min_radius de arriba para que la desaceleracion tenga margen
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.175, 0.1], [0.175, -0.1], [-0.175, -0.1], [-0.175, 0.1]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.6
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Solo hace falta si van a navegar con MAPA GUARDADO (opcion 2a del chat).
# Si navegan en modo slam:=True (2b), amcl NO se lanza y esta seccion se ignora.
# ---------------------------------------------------------------------------
amcl:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    set_initial_pose: false   # pondran la pose inicial a mano con "2D Pose Estimate" en rviz
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_max_range: 8.0
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"   # aproximacion razonable a baja velocidad; no hay modelo Ackermann nativo en AMCL

map_server:
  ros__parameters:
    yaml_filename: ""   # se pasa por argumento de launch (map:=...)

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "bicycle_steering_controller/reference"
    enable_stamped_cmd_vel: true
    transform_tolerance: 0.3
