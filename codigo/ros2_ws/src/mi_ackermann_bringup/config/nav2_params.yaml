%YAML 1.1
---
# nav2_params.yaml
# Version para NAVEGAR SOBRE MAPA FIJO (bringup_launch.py: incluye map_server + amcl).
# El mapeo en vivo / slam_toolbox se retoma despues, en otro archivo.
#
# Parametros del robot usados para calcular lo de abajo:
#   wheelbase = 0.15 m
#   wheel_radius = 0.02 m
#   ancho (width) = 0.20 m  -> +-0.10 m en Y
#   largo (length) = 0.35 m -> +-0.175 m en X
#   alto = 0.24 m
#   vel max/min mandada por teclado = +-0.2 m/s  -> el robot SI puede reversa
#   min_turning_radius = wheelbase / tan(max_steer) = 0.15 / tan(0.4 rad) = 0.355 m
#     (0.4 rad es el limite del joint de direccion que vimos en el xacro;
#      si lo cambiaron, recalculen este numero)
#
# Como puede retroceder, se activa allow_reversing y se usa REEDS_SHEPP en el
# planner (permite rutas con tramos en reversa), en vez de DUBIN (solo adelante).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

controller_server:
  ros__parameters:
    controller_frequency: 10.0     # iguala al update_rate real de tu controller_manager
    enable_stamped_cmd_vel: true   # bicycle_steering_controller espera TwistStamped
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.2
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2        # tope real, medido con el teclado
      max_linear_accel: 0.5
      max_linear_decel: 0.5
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      transform_tolerance: 0.3

      use_rotate_to_heading: false   # no puede girar en el sitio
      allow_reversing: true          # SI puede reversa (+-0.2 m/s confirmado)

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.2   # un poco mayor al min_turning_radius (0.355)
      regulated_linear_scaling_min_speed: 0.08

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      tolerance: 0.1
      allow_unknown: true
      max_iterations: 1000000
      minimum_turning_radius: 0.231      # wheelbase / tan(max_steer)
      motion_model_for_search: "REEDS_SHEPP"   # permite tramos en reversa
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 1.0
      analytic_expansion_max_length: 3.0

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true   # FALTABA: sin esto choca con el TwistStamped de controller_server/velocity_smoother en el mismo topic cmd_vel_nav
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]   # "spin" no aplica: el robot no gira en el sitio
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]   # simetrico: SI puede reversa a la misma velocidad
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # footprint real: largo=0.35 (+-0.175 en X), ancho=0.20 (+-0.10 en Y), centrado en base_link
      footprint: "[[0.175, 0.10], [0.175, -0.10], [-0.175, -0.10], [-0.175, 0.10]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 8
        max_obstacle_height: 0.3      # un poco mas que el alto del robot (0.24)
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.05   # >= regulated_linear_scaling_min_radius (0.45) da margen de frenado
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.175, 0.10], [0.175, -0.10], [-0.175, -0.10], [-0.175, 0.10]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.1
      always_send_full_costmap: true

collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true   # IMPORTANTE: Le dice al monitor que use TwistStamped
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    
    # --- AQUI HACEMOS EL REMAPEO NATIVAMENTE ---
    # El monitor recibe la velocidad de Nav2 (del velocity_smoother)
    cmd_vel_in_topic: "cmd_vel_smoothed" 
    # Y la publica directamente a tu controlador tipo bicicleta
    cmd_vel_out_topic: "/bicycle_steering_controller/reference" 
    # -------------------------------------------
    
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[0.175, 0.10], [0.175, -0.10], [-0.175, -0.10], [-0.175, 0.10]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      
    # CORRECCIÓN DE LA SINTAXIS DEL ESCÁNER
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      
# ---------------------------------------------------------------------------
# Mapa fijo: map_server + amcl (bringup_launch.py los levanta a los dos)
# ---------------------------------------------------------------------------
map_server:
  ros__parameters:
    yaml_filename: ""   # se pasa por argumento de launch: map:=~/ros2_ws/maps/mapa_final.yaml

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

amcl:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    set_initial_pose: false      # la ponen a mano con "2D Pose Estimate" en rviz
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_max_range: 8.0
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"   # AMCL no tiene modelo Ackermann nativo; aproximacion razonable a baja velocidad

docking_server:
  ros__parameters:
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    odom_frame: "odom"
    map_frame: "map"
    dock_plugins: ['simple_dock']
    simple_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false
# ---------------------------------------------------------------------------
# lifecycle managers de bringup_launch.py (localization = map_server+amcl,
# navigation = el resto). Nombres/nodos por defecto del paquete nav2_bringup.
# ---------------------------------------------------------------------------
lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: ["map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server",
                 "planner_server",
                 "behavior_server",
                 "bt_navigator",
                 "waypoint_follower",
                 "velocity_smoother"]

